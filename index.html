<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Platformer – Level 1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="frame">
    <canvas id="game" width="720" height="720" aria-label="Game canvas"></canvas>

    <div id="overlay" class="overlay">
      <div class="overlay-card">
        <h2 id="overlay-title">Ready?</h2>
        <p id="overlay-text">Press Space to begin</p>
      </div>
    </div>

    <div class="hud" aria-live="polite">
      <div>LEVEL: <span id="hud-level">1</span></div>
      <div>SCORE: <span id="hud-score">0</span></div>
    </div>
  </main>

  <p class="hint">Move: ← → / A D &nbsp;|&nbsp; Hold jump: ↑ / W / Space</p>

  <script src="src/platform.js"></script>
  <script src="src/collectible.js"></script>
  <script src="src/player.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
